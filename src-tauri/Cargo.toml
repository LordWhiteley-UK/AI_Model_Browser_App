[package]
name = "ai-model-browser"
version = "0.1.5"
description = "AI Model Browser - Discover and manage local AI models"
authors = ["Claude Code"]
edition = "2021"

[lib]
name = "ai_model_browser_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "ai-model-browser"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.0.0", features = [] }

[dependencies]
tauri = { version = "=2.0.0", features = [] }
tauri-plugin-shell = "=2.0.0"
tauri-plugin-http = "=2.0.0"
tauri-plugin-updater = "=2.0.0"
tauri-utils = "=2.0.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
